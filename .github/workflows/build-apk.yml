name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Nativefier Globally
        run: npm install -g nativefier

      - name: Generate APK with Nativefier
        run: |
          nativefier --name "WesamApp" --platform android --arch arm64 --disable-gpu . ./output

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wesam-apk
          path: output/*.apk
